name: CI
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/launcher/src-tauri }
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --manifest-path apps/launcher/src-tauri/Cargo.toml
      - run: pnpm --filter @quiver/e2e build
      - run: xvfb-run -a pnpm e2e
      # Read-only run against the real catalog; reported, not gating, since the catalog changes on its own.
      - name: Live catalog
        continue-on-error: true
        timeout-minutes: 15
        run: xvfb-run -a pnpm --filter @quiver/e2e live

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/launcher/src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path apps/launcher/src-tauri/Cargo.toml
      - run: pnpm --filter @quiver/launcher tauri build --debug --no-bundle
      - name: WebDriver for WebView2
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          msedgedriver-tool.exe
          .\msedgedriver.exe --version
          # Verbose driver log, printed after the run.
          Set-Content msedgedriver-verbose.cmd "@`"$PWD\msedgedriver.exe`" %* --verbose --log-path=`"$env:RUNNER_TEMP\msedgedriver.log`""
          echo "NATIVE_DRIVER=$PWD\msedgedriver-verbose.cmd" >> $env:GITHUB_ENV
      - name: The app starts
        run: |
          $env:QUIVER_DATA = "$env:RUNNER_TEMP\quiver-smoke"
          $app = Start-Process apps\launcher\src-tauri\target\debug\quiver-launcher.exe -PassThru
          Start-Sleep 10
          "still running: $(-not $app.HasExited), exit code: $($app.ExitCode)"
          Get-Content "$env:QUIVER_DATA\quiver.log" -ErrorAction SilentlyContinue
          Stop-Process $app -ErrorAction SilentlyContinue
      # Read-only run against the real catalog; reported, not gating, since the catalog changes on its own.
      - name: Live catalog
        continue-on-error: true
        timeout-minutes: 15
        run: pnpm --filter @quiver/e2e live
      - name: Driver log
        if: always()
        run: Get-Content "$env:RUNNER_TEMP\msedgedriver.log" -Tail 80 -ErrorAction SilentlyContinue

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/launcher/src-tauri }
      - run: pnpm install --frozen-lockfile
      # Unsigned until there are signing keys.
      - run: pnpm --filter @quiver/launcher tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Quiver Launcher Windows installer
          path: apps/launcher/src-tauri/target/release/bundle/nsis/*.exe

  # For Linux and Steam Deck: runs without installing anything. Built on the
  # oldest supported Ubuntu so it works on older and newer distros alike.
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/launcher/src-tauri }
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev libfuse2 xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quiver/launcher tauri build --bundles appimage
      - name: The AppImage starts
        run: |
          export QUIVER_DATA=$RUNNER_TEMP/quiver-smoke
          # Output goes to a file so nothing left running holds the step open.
          status=0; xvfb-run -a timeout 15 apps/launcher/src-tauri/target/release/bundle/appimage/*.AppImage > $RUNNER_TEMP/app.log 2>&1 || status=$?
          cat $RUNNER_TEMP/app.log $QUIVER_DATA/quiver.log 2>/dev/null || true
          # 124: still running when the timeout stopped it.
          test $status -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: Quiver Launcher for Linux (AppImage)
          path: apps/launcher/src-tauri/target/release/bundle/appimage/*.AppImage
