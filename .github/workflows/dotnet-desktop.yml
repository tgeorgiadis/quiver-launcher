name: .NET Desktop Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VELOPACK_VERSION: "1.2.0"
  PACK_ID: QuiverLauncher
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore QuiverLauncher.sln

    - name: Test with coverage
      run: dotnet test QuiverLauncher.sln -c Release --no-restore --logger "console;verbosity=normal" --blame-hang-timeout 5m --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/coverage"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-cobertura
        path: ${{ runner.temp }}/coverage/**/coverage.cobertura.xml
        retention-days: 14

  pack-windows:
    needs: test
    runs-on: windows-latest
    # Stable OIDC subject for tags and branches: repo:…/quiver-launcher:environment:signing
    environment: signing
    permissions:
      contents: read
      id-token: write
    env:
      TRUSTED_SIGNING_ENABLED: ${{ vars.AZURE_TRUSTED_SIGNING_ENABLED }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          8.0.x

    - name: Resolve pack version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE '<Version>[^<]+' QuiverLauncher.App.csproj | head -n1 | sed 's/<Version>//')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Pack version: $VERSION"

    - name: Publish Windows x64
      run: |
        dotnet publish QuiverLauncher.Desktop/QuiverLauncher.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -o publish/win-x64
        Remove-Item publish/win-x64/apps.json -ErrorAction SilentlyContinue

    - name: Install vpk
      run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

    - name: Azure login for Artifact Signing
      id: azure_login
      if: env.TRUSTED_SIGNING_ENABLED == 'true'
      continue-on-error: true
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Write Azure Trusted Signing metadata
      if: env.TRUSTED_SIGNING_ENABLED == 'true' && steps.azure_login.outcome == 'success'
      shell: pwsh
      run: |
        $json = @"
        {
          "Endpoint": "${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}",
          "CodeSigningAccountName": "${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}",
          "CertificateProfileName": "${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}"
        }
        "@
        [System.IO.File]::WriteAllText("$PWD/signing-metadata.json", $json.Trim(), [System.Text.UTF8Encoding]::new($false))

    - name: Velopack pack (Windows, signed)
      if: env.TRUSTED_SIGNING_ENABLED == 'true' && steps.azure_login.outcome == 'success'
      shell: pwsh
      run: |
        vpk pack `
          --packId ${{ env.PACK_ID }} `
          --packVersion ${{ steps.ver.outputs.version }} `
          --packDir publish/win-x64 `
          --mainExe QuiverLauncher.exe `
          --icon icon.ico `
          --runtime win-x64 `
          --channel win `
          --noInst true `
          --outputDir releases/win-x64 `
          --azureTrustedSignFile "$PWD/signing-metadata.json"

    - name: Velopack pack (Windows, unsigned)
      if: env.TRUSTED_SIGNING_ENABLED != 'true' || steps.azure_login.outcome != 'success'
      shell: pwsh
      run: |
        if ("${{ env.TRUSTED_SIGNING_ENABLED }}" -eq "true") {
          Write-Warning "Azure login failed. Windows Velopack packages will be UNSIGNED."
        } else {
          Write-Warning "AZURE_TRUSTED_SIGNING_ENABLED is not 'true'. Windows Velopack packages will be UNSIGNED."
        }
        vpk pack `
          --packId ${{ env.PACK_ID }} `
          --packVersion ${{ steps.ver.outputs.version }} `
          --packDir publish/win-x64 `
          --mainExe QuiverLauncher.exe `
          --icon icon.ico `
          --runtime win-x64 `
          --channel win `
          --noInst true `
          --outputDir releases/win-x64

    - name: Upload Windows Velopack artifacts
      uses: actions/upload-artifact@v4
      with:
        name: velopack-win-x64
        path: releases/win-x64/**
        retention-days: 14

  pack-linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
          - rid: linux-arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Resolve pack version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE '<Version>[^<]+' QuiverLauncher.App.csproj | head -n1 | sed 's/<Version>//')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Publish ${{ matrix.rid }}
      run: |
        dotnet publish QuiverLauncher.Desktop/QuiverLauncher.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishTrimmed=false -o publish/${{ matrix.rid }}
        # Do not bake user-data leftovers into the AppImage.
        rm -f publish/${{ matrix.rid }}/apps.json \
              publish/${{ matrix.rid }}/settings.json \
              publish/${{ matrix.rid }}/games.json \
              publish/${{ matrix.rid }}/game.json \
              publish/${{ matrix.rid }}/crash.log
        rm -rf publish/${{ matrix.rid }}/Apps publish/${{ matrix.rid }}/Cache

    - name: Install AppImage pack dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y squashfs-tools

    - name: Install vpk
      run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

    - name: Velopack pack (Linux AppImage)
      run: |
        vpk pack \
          --packId ${{ env.PACK_ID }} \
          --packVersion ${{ steps.ver.outputs.version }} \
          --packDir publish/${{ matrix.rid }} \
          --mainExe QuiverLauncher \
          --icon Assets/quiver-icon.png \
          --runtime ${{ matrix.rid }} \
          --channel ${{ matrix.rid }} \
          --outputDir releases/${{ matrix.rid }}

    - name: Upload Linux Velopack artifacts
      uses: actions/upload-artifact@v4
      with:
        name: velopack-${{ matrix.rid }}
        path: releases/${{ matrix.rid }}/**
        retention-days: 14

  pack-macos:
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
          - rid: osx-arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Resolve pack version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE '<Version>[^<]+' QuiverLauncher.App.csproj | head -n1 | sed 's/<Version>//')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Publish ${{ matrix.rid }}
      run: |
        dotnet publish QuiverLauncher.Desktop/QuiverLauncher.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishTrimmed=false -o publish/${{ matrix.rid }}
        rm -f publish/${{ matrix.rid }}/apps.json

    - name: Install vpk
      run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

    - name: Build macOS .icns from quiver-icon.png
      run: |
        set -euo pipefail
        SRC="Assets/quiver-icon.png"
        ICONSET="QuiverLauncher.iconset"
        rm -rf "$ICONSET" QuiverLauncher.icns
        mkdir "$ICONSET"
        for size in 16 32 128 256 512; do
          sips -z "$size" "$size" "$SRC" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
          double=$((size * 2))
          sips -z "$double" "$double" "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
        done
        iconutil -c icns "$ICONSET" -o QuiverLauncher.icns
        test -f QuiverLauncher.icns

    # Apple Developer ID + notarization can be wired later via
    # --signAppIdentity / --signInstallIdentity / --notaryProfile / --keychain.
    - name: Velopack pack (macOS)
      run: |
        vpk pack \
          --packId ${{ env.PACK_ID }} \
          --packVersion ${{ steps.ver.outputs.version }} \
          --packDir publish/${{ matrix.rid }} \
          --mainExe QuiverLauncher \
          --icon QuiverLauncher.icns \
          --runtime ${{ matrix.rid }} \
          --channel ${{ matrix.rid }} \
          --noInst true \
          --outputDir releases/${{ matrix.rid }}

    - name: Upload macOS Velopack artifacts
      uses: actions/upload-artifact@v4
      with:
        name: velopack-${{ matrix.rid }}
        path: releases/${{ matrix.rid }}/**
        retention-days: 14

  # Publish Velopack packages to a GitHub Release when a v* tag is pushed.
  # Runs even if some desktop packs fail so successful channels still ship.
  # Android is required: tags must include a signed APK.
  publish-github-release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' && needs.build-android.result == 'success'
    needs: [test, pack-windows, pack-linux, pack-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve pack version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE '<Version>[^<]+' QuiverLauncher.App.csproj | head -n1 | sed 's/<Version>//')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [[ "$VERSION" == *-* ]]; then
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download Velopack artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: velopack-*
        path: release-assets
        merge-multiple: false

    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: release-assets/android

    - name: Publish GitHub Release with user + Velopack feed assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TAG="${GITHUB_REF_NAME}"
        VERSION="${{ steps.ver.outputs.version }}"
        REPO="${{ github.repository }}"
        BASE="https://github.com/${REPO}/releases/download/${TAG}"

        # Drop Squirrel leftover; clients use releases.{channel}.json.
        find release-assets -type f -name 'RELEASES' -delete
        # Drop Setup installers if any slipped through (portable-first).
        find release-assets -type f \( -name '*-Setup.exe' -o -name '*-Setup.pkg' -o -name 'assets.*.json' \) -delete

        mapfile -t FILES < <(
          find release-assets -type f \( \
            -name '*.nupkg' -o \
            -name 'releases.*.json' -o \
            -name '*Portable.zip' -o \
            -name '*.AppImage' -o \
            -name '*.apk' \
          \) | sort
        )
        if [[ ${#FILES[@]} -eq 0 ]]; then
          echo "No release assets found under release-assets/"
          ls -laR release-assets || true
          exit 1
        fi

        NOTES_BODY="$(mktemp)"
        {
          echo "## Downloads"
          echo ""
          echo "- **Windows:** [${BASE}/QuiverLauncher-win-Portable.zip](${BASE}/QuiverLauncher-win-Portable.zip)"
          echo "- **Linux x64:** [${BASE}/QuiverLauncher-linux-x64.AppImage](${BASE}/QuiverLauncher-linux-x64.AppImage)"
          echo "- **Linux ARM64:** [${BASE}/QuiverLauncher-linux-arm64.AppImage](${BASE}/QuiverLauncher-linux-arm64.AppImage)"
          echo "- **Android:** [${BASE}/QuiverLauncher-android.apk](${BASE}/QuiverLauncher-android.apk)"
          echo "- **macOS:** work in progress while I get the signing sorted"
          echo ""
          echo "---"
          echo ""
          if [[ -f RELEASE_NOTES.md ]]; then
            cat RELEASE_NOTES.md
          else
            echo "Quiver Launcher v${VERSION}"
          fi
        } > "$NOTES_BODY"

        # Clean up any leftover draft from a previous failed publish.
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release delete "$TAG" --yes || true
        fi

        PRE_ARGS=()
        if [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]]; then
          PRE_ARGS+=(--prerelease)
        fi

        gh release create "$TAG" \
          --title "Quiver Launcher v${VERSION}" \
          --notes-file "$NOTES_BODY" \
          --target "$GITHUB_SHA" \
          "${PRE_ARGS[@]}" \
          "${FILES[@]}"

  build-android:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Install Android workload
      run: dotnet workload install android

    - name: Install Android SDK dependencies
      run: |
        dotnet build QuiverLauncher.Android/QuiverLauncher.Android.csproj -t:InstallAndroidDependencies \
          -f net10.0-android \
          -p:AndroidSdkDirectory="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" \
          -p:AcceptAndroidSDKLicenses=True

    - name: Resolve Android version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE '<Version>[^<]+' QuiverLauncher.App.csproj | head -n1 | sed 's/<Version>//')
        BASE="${VERSION%%-*}"
        IFS='.' read -r MAJOR MINOR PATCH _ <<< "${BASE}.0.0"
        APP_VERSION=$((10#${MAJOR:-0} * 10000 + 10#${MINOR:-0} * 100 + 10#${PATCH:-0}))
        echo "display=$VERSION" >> "$GITHUB_OUTPUT"
        echo "version_code=$APP_VERSION" >> "$GITHUB_OUTPUT"
        echo "Android display=$VERSION versionCode=$APP_VERSION"

    - name: Detect Android signing secrets
      id: sign
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Android keystore secrets are required to publish a signed APK on tags."
            exit 1
          fi
        fi

    - name: Compile Android
      if: steps.sign.outputs.available != 'true'
      run: dotnet build QuiverLauncher.Android/QuiverLauncher.Android.csproj -c Release

    - name: Publish signed Android APK
      if: steps.sign.outputs.available == 'true'
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        KEYSTORE_PATH="QuiverLauncher.Android/ci-release.jks"
        STORE_PASS="${RUNNER_TEMP}/android-store.pass"
        KEY_PASS="${RUNNER_TEMP}/android-key.pass"
        cleanup() {
          rm -f "${KEYSTORE_PATH}" "${STORE_PASS}" "${KEY_PASS}"
        }
        trap cleanup EXIT
        printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 -d > "${KEYSTORE_PATH}"
        printf '%s' "${ANDROID_KEYSTORE_PASSWORD}" > "${STORE_PASS}"
        printf '%s' "${ANDROID_KEY_PASSWORD}" > "${KEY_PASS}"
        chmod 600 "${STORE_PASS}" "${KEY_PASS}"
        keytool -list -keystore "${KEYSTORE_PATH}" -storepass:file "${STORE_PASS}" >/dev/null
        mkdir -p artifacts/android
        dotnet publish QuiverLauncher.Android/QuiverLauncher.Android.csproj -c Release -f net10.0-android \
          -p:AndroidPackageFormats=apk \
          -p:ApplicationDisplayVersion="${{ steps.ver.outputs.display }}" \
          -p:ApplicationVersion="${{ steps.ver.outputs.version_code }}" \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=ci-release.jks \
          -p:AndroidSigningStorePass="file:${STORE_PASS}" \
          -p:AndroidSigningKeyAlias="${ANDROID_KEY_ALIAS}" \
          -p:AndroidSigningKeyPass="file:${KEY_PASS}"
        mapfile -t apks < <(find QuiverLauncher.Android -iname '*signed*.apk' -print)
        if [[ ${#apks[@]} -eq 0 ]]; then
          echo "No signed APK produced."
          find QuiverLauncher.Android -iname '*.apk' -print || true
          exit 1
        fi
        cp "${apks[0]}" artifacts/android/QuiverLauncher-android.apk
        ls -lh artifacts/android/QuiverLauncher-android.apk

    - name: Upload Android APK
      if: steps.sign.outputs.available == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: artifacts/android/QuiverLauncher-android.apk
        retention-days: 14
