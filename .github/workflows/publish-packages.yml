# Publishes @quiverlauncher/api and @quiverlauncher/ui (packages/) to npm when
# a version in their package.json changes on v4; versions npm already has are
# skipped. npm's trusted publishing checks this workflow's identity, so no npm
# token is stored anywhere, and each release carries provenance.
name: Publish packages
on:
  push:
    branches: [v4]
    paths: ["packages/*/package.json"]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    # Forks have nothing to publish.
    if: github.repository == 'tgeorgiadis/quiver-launcher'
    runs-on: ubuntu-24.04
    # Give this environment a required reviewer (Settings > Environments) so a
    # release waits for approval; npm's trusted publisher names it too.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      # Trusted publishing needs npm 11.5.1 or later, which pnpm publishes through.
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" typecheck
      - run: pnpm --filter "./packages/*" test
      # Each package builds dist/ first (prepack); workspace:^ becomes the real version.
      - run: pnpm --recursive --filter "./packages/*" publish --no-git-checks
