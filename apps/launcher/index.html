<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      An app's window, not a web page: on a phone it neither pinches to zoom nor zooms on a double tap (Settings has the
      interface size). Android draws it edge to edge, under the status bar; app.css keeps clear of the bars.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Quiver Launcher</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
